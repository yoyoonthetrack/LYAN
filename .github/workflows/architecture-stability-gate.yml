name: Architecture Stability Gate

on:
  pull_request:
  push:
    branches:
      - architecture-stabilization

jobs:
  architecture-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run architecture audit
        run: npm test
