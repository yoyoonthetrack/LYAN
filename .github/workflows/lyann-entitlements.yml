name: Plan rights on isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'lyann-plans.js'
      - 'api/business-*.js'
      - '*entitlement*.sql'
      - '83_lyann_atomic_profile_skills_staging.sql'
      - 'tests/business-workflow.test.js'
      - 'tests/entitlements*'
      - 'tests/fixtures/entitlements-schema.sql'
      - '.github/workflows/lyann-entitlements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entitlement-rights:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/bokantaj-map-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rights_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rights_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: local_test_only
      LYANN_TEST_PG_PORT: '55432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: API rights and payment regression tests
        run: node --test tests/plan-badges.test.js tests/business-workflow.test.js tests/payment-quote-type.test.js tests/phase635-milestone-editor.test.js
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Transactional and concurrent rights tests on loopback only
        run: node tests/entitlements-concurrency.cjs
