name: V2 Chat Legacy Retirement

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retire legacy chat owner
        run: |
          node scripts/apply-v2-chat-legacy-retirement.js
          node --check chat-logic.js
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo "Legacy chat retirement already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-logic.js
          git commit -m "refactor: retire legacy chat contact and shell owners"
          git push origin HEAD:architecture-stabilization
