name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/financial-rpc-hardening]

permissions:
  contents: read

jobs:
  static-security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax check
        run: |
          node --check api/index.js
          node --check api/server.js

      - name: Financial RPC privilege assertions
        shell: bash
        run: |
          set -euo pipefail
          FILE="33_financial_rpc_server_only_hardening.sql"
          test -f "$FILE"
          grep -F "prepare_milestone_release_secure(uuid)" "$FILE"
          grep -F "confirm_milestone_transfer_secure(uuid, text)" "$FILE"
          grep -F "fail_milestone_transfer_secure(uuid, text)" "$FILE"
          grep -F "confirm_refund_secure(" "$FILE"
          grep -F "FROM PUBLIC, anon, authenticated" "$FILE"
          grep -F "TO service_role" "$FILE"

      - name: Stripe live remains opt-in
        shell: bash
        run: |
          set -euo pipefail
          grep -F "STRIPE_LIVE_ENABLED !== 'true'" api/index.js

      - name: Production legacy endpoints are blocked by gateway
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'/v1/auth/login'" api/index.js
          grep -F "'/v1/payments/create-intent'" api/index.js
          grep -F "'/v1/payments/validate-and-transfer'" api/index.js
          grep -F "LEGACY_ENDPOINT_DISABLED" api/index.js

      - name: Rewritten route detection is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F "x-vercel-original-url" api/index.js
          grep -F "x-forwarded-uri" api/index.js
          grep -F "getCandidatePaths" api/index.js

      - name: Direct historical function is not callable
        run: |
          node <<'NODE'
          const historical = require('./api/server');
          let body = '';
          const headers = {};
          const res = {
            statusCode: 0,
            setHeader(k, v) { headers[k] = v; },
            end(chunk = '') { body += chunk; }
          };
          historical({ headers: {}, method: 'GET', url: '/api/server' }, res);
          if (res.statusCode !== 404) throw new Error(`direct function returned ${res.statusCode}`);
          if (headers['Cache-Control'] !== 'private, no-store') throw new Error('direct function cache is unsafe');
          if (!body.includes('NOT_FOUND')) throw new Error('direct function did not fail closed');
          NODE

      - name: Webhook implementation fails closed
        shell: bash
        run: |
          set -euo pipefail
          grep -F "STRIPE_WEBHOOK_CONFIG_MISSING" api/server.js
          grep -F "STRIPE_SIGNATURE_REQUIRED" api/server.js
          if grep -F "let event = req.body" api/server.js; then
            echo "Unsigned webhook fallback is forbidden"
            exit 1
          fi
