name: V2 Messaging Surface Migration

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply messaging ownership migration
        run: |
          node scripts/apply-v2-messaging-surface-migration.js
          node --check chat-logic.js
          node --check messaging-ui.js
          node --check app-router.js
          node --check surface-manager.js
      - name: Commit migrated chat source
        run: |
          if git diff --quiet; then
            echo "Messaging ownership migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-logic.js
          git commit -m "refactor: make canonical messaging owner control all chat surfaces"
          git push origin HEAD:architecture-stabilization
