name: Neutralize Profile Placeholders

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Neutralize static profile placeholders
        run: node scripts/neutralize-profile-placeholders.js
      - name: Commit source cleanup when changed
        run: |
          if git diff --quiet; then
            echo "Profile placeholders already neutral."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.html results.html
          git commit -m "refactor: neutralize static profile and contact placeholders"
          git push origin HEAD:architecture-stabilization
