name: Migrate Drawer To Canonical Router

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Migrate drawer routing
        run: |
          node scripts/migrate-drawer-to-router.js
          node --check script.js
      - name: Commit migrated source
        run: |
          if git diff --quiet; then
            echo "Drawer routing already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "refactor: route hamburger drawer through canonical router"
          git push origin HEAD:architecture-stabilization
