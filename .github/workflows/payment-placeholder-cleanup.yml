name: Payment Placeholder Cleanup

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove demo payment placeholders
        run: |
          node scripts/remove-production-demo-card-placeholders.js
      - name: Commit cleaned pages when changed
        run: |
          if git diff --quiet; then
            echo "Payment placeholders already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.html results.html
          git commit -m "refactor: remove demo card placeholders from product pages"
          git push origin HEAD:architecture-stabilization
