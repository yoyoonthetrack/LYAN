name: V2 App Shell Routing Migration

on:
  push:
    branches:
      - architecture-stabilization

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-stabilization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply app-shell routing migration
        run: |
          node scripts/apply-v2-app-shell-routing.js
          node --check app-shell.js
      - name: Commit migrated app-shell
        run: |
          if git diff --quiet; then
            echo "App-shell routing migration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js
          git commit -m "refactor: make app router sole owner of bottom navigation"
          git push origin HEAD:architecture-stabilization
