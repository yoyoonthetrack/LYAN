name: Bokantaj Browser Regressions

on:
  pull_request:
    paths:
      - 'script.js'
      - 'api-client.js'
      - 'notifications-ui.js'
      - 'notification-engine.js'
      - 'bokantaj-repository.js'
      - 'tests/e2e/bokantaj_*.spec.js'
      - 'tests/e2e/notifications_bell_browser_qa.spec.js'
      - '.github/workflows/bokantaj-browser-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Serve isolated web app
        run: |
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/lyann-browser-qa-server.log 2>&1 &
          echo $! > /tmp/lyann-browser-qa-server.pid

      - name: Run Bokantaj and bell desktop/mobile regressions
        env:
          LYANN_E2E_BASE_URL: http://127.0.0.1:8090
        run: |
          npx playwright test \
            tests/e2e/bokantaj_public_visibility.spec.js \
            tests/e2e/bokantaj_moderation_browser_qa.spec.js \
            tests/e2e/notifications_bell_browser_qa.spec.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bokantaj-browser-evidence
          path: |
            test-results/qa-bokantaj-*.png
            test-results/qa-notifications-*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
