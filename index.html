<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYANN — Découvrir</title>
    <meta http-equiv="refresh" content="0;url=/discover">
    <link rel="canonical" href="/discover">
    <script>
        (function () {
            // In the app the fallback link is never shown: the next page decides between the welcome flow and Découvrir.
            try {
                var cap = window.Capacitor;
                if (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) document.documentElement.style.visibility = 'hidden';
            } catch (e) {}
            var target = 'discover.html' + (window.location.search || '') + (window.location.hash || '');
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p><a href="discover.html">Continuer vers Découvrir</a></p>
</body>
</html>
